# PostgreSQL local para desarrollo: docker compose up -d
services:
  db:
    image: postgres:16
    container_name: foodstore_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: foodstore_db
    ports:
      - "5434:5432"
    volumes:
      - foodstore_pgdata:/var/lib/postgresql/data

volumes:
  foodstore_pgdata:
